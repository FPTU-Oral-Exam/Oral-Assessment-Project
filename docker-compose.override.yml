# docker-compose.override.yml
# Local development override - adds hot reload volumes

services:
  web:
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/staff-portal:/app/apps/staff-portal
      - /app/apps/staff-portal/node_modules
      - /app/apps/staff-portal/.next
    ports:
      - "127.0.0.1:3000:3000"

  api:
    environment:
      - DEBUG=true
    volumes:
      - ./services/api:/app
    ports:
      - "8000:8000"

  worker:
    volumes:
      - ./services/api:/app
