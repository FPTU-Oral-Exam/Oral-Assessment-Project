# docker-compose.override.yml
# Local development override - adds hot reload volumes

services:
  web:
    build:
      context: .
      dockerfile: apps/staff-portal/Dockerfile
    environment:
      - NODE_ENV=development
      - API_INTERNAL_URL=http://api:8000
    volumes:
      - ./apps/staff-portal:/app/apps/staff-portal
      - /app/apps/staff-portal/node_modules
      - /app/apps/staff-portal/.next
    ports:
      - "127.0.0.1:3000:3000"

  api:
    build:
      context: ./services/api
    environment:
      - DEBUG=true
    volumes:
      - ./services/api:/app
    ports:
      - "8000:8000"

  migrate:
    build:
      context: ./services/api
    volumes:
      - ./services/api:/app

  worker:
    build:
      context: ./services/api
    volumes:
      - ./services/api:/app

