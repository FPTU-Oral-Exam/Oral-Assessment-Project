<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-size="22" font-weight="600" fill="#333333">Approximate composition of the air</text>
  
  <!-- Pie Chart Center (350, 320), Radius 190 -->
  <!-- 79% Nitrogen (Blue): from ~90 deg to ~14.4 deg -->
  <!-- 1% Other gases (Yellow): from ~14.4 deg to ~18 deg -->
  <!-- 20% Oxygen (Pink): from ~18 deg to ~90 deg -->
  <g transform="translate(340, 330)">
    <!-- Nitrogen: 79% (Blue) -->
    <!-- Large sector spanning 284.4 degrees -->
    <path d="M 0 0 L 12.0 -189.6 A 190 190 0 1 0 190.0 0 Z" fill="#8cb9fc" stroke="#ffffff" stroke-width="2" />
    
    <!-- Other gases: 1% (Yellow) -->
    <!-- Small slice 3.6 degrees from 14.4 deg (angle 75.6) to 18 deg (angle 72) -->
    <path d="M 0 0 L 23.9 -188.5 A 190 190 0 0 0 12.0 -189.6 Z" fill="#fff59d" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Oxygen: 20% (Pink) -->
    <!-- Sector 72 degrees from angle 72 deg to 0 deg -->
    <path d="M 0 0 L 190.0 0 A 190 190 0 0 0 23.9 -188.5 Z" fill="#f8a5c2" stroke="#ffffff" stroke-width="2" />

    <!-- Percentage Labels on Pie -->
    <!-- 79% in Nitrogen -->
    <text x="-70" y="80" text-anchor="middle" font-size="16" font-weight="500" fill="#444444">79%</text>
    
    <!-- 20% in Oxygen -->
    <text x="75" y="-55" text-anchor="middle" font-size="16" font-weight="500" fill="#444444">20%</text>
    
    <!-- 1% in Other gases pointer -->
    <text x="18" y="-200" text-anchor="middle" font-size="15" font-weight="500" fill="#444444">1%</text>
  </g>

  <!-- Legend -->
  <g transform="translate(560, 150)">
    <!-- Oxygen -->
    <rect x="0" y="0" width="22" height="22" fill="#f8a5c2" />
    <text x="32" y="17" font-size="16" fill="#555555">Oxygen</text>

    <!-- Other gases -->
    <rect x="0" y="36" width="22" height="22" fill="#fff59d" />
    <text x="32" y="53" font-size="16" fill="#555555">Other gases</text>

    <!-- Nitrogen -->
    <rect x="0" y="72" width="22" height="22" fill="#8cb9fc" />
    <text x="32" y="89" font-size="16" fill="#555555">Nitrogen</text>
  </g>

  <!-- Annotation Note -->
  <g transform="translate(550, 400)">
    <text x="0" y="0" font-size="14" fill="#777777" font-weight="500">NB "Other gases"</text>
    <text x="0" y="20" font-size="14" fill="#777777">includes carbon dioxide</text>
    <text x="0" y="40" font-size="14" fill="#777777">(0.03%) and small</text>
    <text x="0" y="60" font-size="14" fill="#777777">proportions of other</text>
    <text x="0" y="80" font-size="14" fill="#777777">gases include argon</text>
    <text x="0" y="100" font-size="14" fill="#777777">and water vapour.</text>
  </g>
</svg>
